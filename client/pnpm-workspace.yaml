allowBuilds:
  esbuild: true
  '@parcel/watcher': true
  unrs-resolver: true
  core-js: false

# Sett minimumReleaseAge for å unngå at pakker som nylig er publisert (< 7 dager) blir brukt i byggene.
# Sikkerhetstiltak for å unngå at vi bruker pakker som nylig er publisert og som potensielt kan være ondsinnede eller ustabile.
minimumReleaseAge: 10080 # 7 dager

minimumReleaseAgeExclude:
  - "@navikt/*"

overrides:
  immutable@>=5.0.0-beta.1 <5.1.8: ^5.1.8
  # Tving js-yaml til versjoner som ikke er truffet av CVE-2026-59869
  js-yaml@>=3.0.0 <3.15.2: ^3.15.2
  js-yaml@>=4.0.0 < 4.3.0: ^4.3.0
  # Tving brace-expansion til versjon som ikke er truffet av CVE-2026-13149
  brace-expansion@<1.1.16 : ^1.1.16
  # Tving browserslist til versjon som ikke er truffet av CVE-2026-73088
  browserslist@<= 4.28.6: ^4.28.7
  postcss: "8.5.23"
  # Pinnet pga. https://github.com/dperini/nwsapi/issues/215:
  # nwsapi 2.2.24–2.2.27 har en rekursjonsbug i matchesNative() der
  # element.matches(':modal'/':fullscreen'/':open'/':closed') kaller
  # seg selv til stack overflow under jsdom. Trigges av @floating-ui/react
  # sin fokus-/posisjoneringslogikk i Aksel Modal og gjorde testene
  # 15–90x tregere. Fjern denne overriden når en patchet nwsapi-versjon
  # (>2.2.27) er utgitt og jsdom har oppdatert sin avhengighet.
  nwsapi: "2.2.23"

